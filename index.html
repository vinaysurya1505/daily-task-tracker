        // --- Firebase configuration loaded from API ---
        let firebaseConfig = null;
        let appId = null;
        
        // Load Firebase config from API (secure - no hardcoded keys)
        // API keys are loaded from .env via /api/auth endpoint
        const loadFirebaseConfig = async () => {
            try {
                const response = await fetch('/api/auth');
                if (!response.ok) {
                    throw new Error('Failed to fetch config from server');
                }
                const config = await response.json();
                if (!config.firebaseConfig || !config.appId) {
                    throw new Error('Invalid configuration received');
                }
                firebaseConfig = config.firebaseConfig;
                appId = config.appId;
            } catch (error) {
                console.error('Failed to load Firebase config:', error);
                // No fallback - API keys must come from environment variables via API
                // This ensures security and prevents hardcoded keys in the client
                throw new Error('Application configuration unavailable. Please ensure environment variables are set correctly.');
            }
        };

        // --- Firebase Initialization (using compat libraries) ---
        let app, auth, db;
        
        const initializeFirebase = async () => {
            await loadFirebaseConfig();
            app = firebase.initializeApp(firebaseConfig);

            db = firebase.firestore();

        // --- Helper Functions (NEW from Version 2) ---
        const calculateDailyAccuracy = (tasks) => {
            const completed = tasks.filter(t => t.completed && t.expectedDuration > 0 && t.actualDuration > 0);
            if (completed.length === 0) return 0;
            const totalExpected = completed.reduce((sum, task) => sum + task.expectedDuration, 0);
            const totalActual = completed.reduce((sum, task) => sum + task.actualDuration, 0);
            if (totalExpected === 0) return 0;
            const accuracy = 100 - (Math.abs(totalExpected - totalActual) / totalExpected) * 100;
            return Math.max(0, Math.round(accuracy));
        };

        // NEW Pomodoro Timer Component from Version 2
        // ✅ Sound alert
    const playSound = () => {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
    gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1);
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + 1);
    };

    // ✅ Desktop Notification
    const showNotification = (title, body) => {
    if (!("Notification" in window)) return;
    if (Notification.permission === "granted") {
        new Notification(title, { body });
    } else if (Notification.permission !== "denied") {
        Notification.requestPermission().then(permission => {
        if (permission === "granted") {
            new Notification(title, { body });
        }
        });
    }
    };

    // ✅ Enhanced Pomodoro Modal
    const PomodoroTimerModal = ({ task, onComplete, onCancel, setNotification }) => {
    const FOCUS_TIME = 25 * 60;
    const [isBreak, setIsBreak] = useState(false);
    const [timeLeft, setTimeLeft] = useState(FOCUS_TIME);
    const [isActive, setIsActive] = useState(false);
    const [breakTime, setBreakTime] = useState(15 * 60);
    const timerRef = useRef(null);

    const formatTime = (seconds) =>
        `${Math.floor(seconds / 60).toString().padStart(2, "0")}:${(seconds % 60).toString().padStart(2, "0")}`;

    useEffect(() => {
        if (isActive && timeLeft > 0) {
        timerRef.current = setInterval(() => setTimeLeft((prev) => prev - 1), 1000);
        } else if (timeLeft === 0) {
        clearInterval(timerRef.current);
        playSound();
        if (!isBreak) {
            const message = "Focus session complete! Time for a break.";
            setNotification({ type: "success", message });
            showNotification("Pomodoro Timer", message);
            onComplete(task, 25);
            const userBreak = prompt("Focus over! Enter break time in minutes:", "15");
            const breakMinutes = parseInt(userBreak, 10);
            if (!isNaN(breakMinutes) && breakMinutes > 0) {
            setBreakTime(breakMinutes * 60);
            setTimeLeft(breakMinutes * 60);
            setIsBreak(true);
            setIsActive(true);
            } else {
            setIsActive(false);
            }
        } else {
            const message = "Break's over! Ready for another session?";
            setNotification({ type: "success", message });
            showNotification("Pomodoro Timer", message);
            setIsBreak(false);
            setIsActive(false);
            setTimeLeft(FOCUS_TIME);
            onCancel();
        }
        }
        return () => clearInterval(timerRef.current);
    }, [isActive, timeLeft, isBreak]);

    const toggleTimer = () => {
        if (!isActive && Notification.permission === "default") {
        Notification.requestPermission();
        }
        setIsActive(!isActive);
    };

    const resetTimer = () => {
        clearInterval(timerRef.current);
        setIsActive(false);
        setIsBreak(false);
        setTimeLeft(FOCUS_TIME);
    };

    return (

            <div className={`text-6xl font-bold my-6 ${isBreak ? "text-green-500" : "text-indigo-600"}`}>
            {formatTime(timeLeft)}

            <button

            <button

            <button onClick={onCancel} className="mt-6 text-sm text-slate-500 hover:text-indigo-500">
            Close Timer
            </button>
        </div>
        </div>
    );
    };

                const labels = [];
                const dateMap = {};

                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    const isoDate = getISOString(date);
                    labels.push(date.toLocaleDateString('en-US', { weekday: 'short' }));

                    const freshDailyTasks = { ...dateMap };

                        const task = doc.data();
                        if (freshDailyTasks[task.date]) {
                            freshDailyTasks[task.date].push(task);
                        }

            const [taskToEdit, setTaskToEdit] = useState(null);
            const [taskForPomodoro, setTaskForPomodoro] = useState(null); // NEW from Version 2
            const [selectedDate, setSelectedDate] = useState(getISOString(new Date()));
            const [streakData, setStreakData] = useState({ current: 0, longest: 0, lastCompletedDate: '' }); // NEW from Version 2

            const tasksCollectionRef = useMemo(() => 
                db.collection(`artifacts/${appId}/users/${user.uid}/tasks`), 
                [user.uid]
            );

            // NEW Streak tracking from Version 2
            const metadataRef = useMemo(() => 
                db.collection(`artifacts/${appId}/users/${user.uid}/metadata`).doc('streak'), 
                [user.uid]
            );

            // NEW Streak data listener from Version 2
            useEffect(() => {
                const unsubscribe = metadataRef.onSnapshot(doc => {
                    if (doc.exists) {
                        setStreakData(doc.data());
                    }
                });
                return () => unsubscribe();
            }, [metadataRef]);

            useEffect(() => {
                setIsLoading(true);
                const q = tasksCollectionRef.where("date", "==", selectedDate);
                
                const unsubscribe = q.onSnapshot((querySnapshot) => {
                    const tasksData = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    tasksData.sort((a, b) => {
                        if (a.completed !== b.completed) return a.completed ? 1 : -1;
                        const aTime = a.createdAt ? a.createdAt.seconds : 0;
                        const bTime = b.createdAt ? b.createdAt.seconds : 0;
                        return aTime - bTime;
                    });
                    setTasks(tasksData);
                    setIsLoading(false);
                }, (error) => {
                    console.error("Error fetching tasks: ", error);
                    setNotification({ type: 'error', message: "Couldn't load tasks."});
                    setIsLoading(false);
                });

                return () => unsubscribe();
            }, [tasksCollectionRef, selectedDate]);

            // NEW Streak update function from Version 2
            const handleUpdateStreak = useCallback(async () => {
                const todayStr = getISOString(new Date());
                if (streakData.lastCompletedDate === todayStr) return; 

                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = getISOString(yesterday);

                let newCurrent = 1;
                if (streakData.lastCompletedDate === yesterdayStr) {
                    newCurrent = (streakData.current || 0) + 1;
                }
                
                const newLongest = Math.max(streakData.longest || 0, newCurrent);
                await metadataRef.set({ current: newCurrent, longest: newLongest, lastCompletedDate: todayStr }, { merge: true });

            }, [metadataRef, streakData]);

            const handleAddTask = async (e) => {
                e.preventDefault();
                if (newTask.trim() === '' || !newExpectedDuration || newExpectedDuration <= 0) {
                    setNotification({ type: 'error', message: "Please enter a task and a valid duration." });
                    return;
                }
                try {
                    await tasksCollectionRef.add({
                        text: newTask.trim(),
                        expectedDuration: parseInt(newExpectedDuration, 10),
                        category: newCategory.trim(),
                        notes: newNotes.trim(), // NEW from Version 2
                        completed: false,
                        actualDuration: null,
                        date: selectedDate,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewTask('');
                    setNewExpectedDuration('');
                    setNewCategory('');
                    setNewNotes(''); // NEW from Version 2
                    setNotification({ type: 'success', message: 'Task added!' });
                } catch (error) {
                    console.error("Error adding task: ", error);
                    setNotification({ type: 'error', message: "Couldn't add task." });
                }
            };
            
            const handleUpdateTask = async (taskId, updatedData) => {
                const taskRef = tasksCollectionRef.doc(taskId);
                try {
                    await taskRef.update(updatedData);
                    setTaskToEdit(null);
                    setNotification({ type: 'success', message: 'Task updated successfully!' });
                } catch(error) {
                    console.error("Error updating task: ", error);
                    setNotification({ type: 'error', message: "Couldn't update task." });
                }
            };

            const handleCompleteTask = async (task, actualDuration) => {
                const taskRef = tasksCollectionRef.doc(task.id);
                try {
                    await taskRef.update({
                        completed: true,
                        actualDuration: parseInt(actualDuration, 10)
                    });
                    setTaskToComplete(null);
                    setNotification({ type: 'success', message: 'Task marked as complete!' });
                    handleUpdateStreak(); // NEW from Version 2
                } catch (error) {
                    console.error("Error completing task: ", error);
                    setNotification({ type: 'error', message: "Couldn't complete task." });
                }
            };

            // NEW Pomodoro completion handler from Version 2
            const handlePomodoroComplete = (task, minutes) => {
                setTaskToComplete({ ...task, pomodoroMinutes: minutes });
                setTaskForPomodoro(null);
            };
            
            const handleUncompleteTask = async (task) => {
                const taskRef = tasksCollectionRef.doc(task.id);
                try {
                    await taskRef.update({
                        completed: false,
                        actualDuration: null
                    });
                } catch (error) {
                     console.error("Error un-completing task: ", error);
                    setNotification({ type: 'error', message: "Couldn't update task." });
                }
            };

            const deleteTask = async (taskId) => {
                const taskRef = tasksCollectionRef.doc(taskId);
                try {
                    await taskRef.delete();
                    setNotification({ type: 'success', message: 'Task deleted!' });
                } catch (error) {
                    console.error("Error deleting task: ", error);
                    setNotification({ type: 'error', message: "Couldn't delete task." });
                }
            };
            
            const calculateTaskAccuracy = (expected, actual) => {
                if (!expected || !actual || expected <= 0 || actual <= 0) return 0;
                const accuracy = 100 - (Math.abs(expected - actual) / expected) * 100;
                return Math.max(0, Math.round(accuracy));
            };

            const overallAccuracy = useMemo(() => calculateDailyAccuracy(tasks), [tasks]);
            
            // Enhanced PDF download function with comprehensive reporting
            const downloadReport = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Header
                doc.setFontSize(20);
                doc.text("TaskTrack - Comprehensive Progress Report", 14, 22);
                doc.setFontSize(12);
                doc.text(`Report Date: ${new Date(selectedDate.replace(/-/g, '/')).toLocaleDateString()}`, 14, 30);
                doc.text(`Generated: ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}`, 14, 37);
                
                // Current Day Tasks Table
                doc.setFontSize(16);
                doc.text("Daily Tasks Summary", 14, 50);
                
                const tableColumn = ["S.No", "Task Description", "Date", "Assigned Time (min)", "Actual Time (min)", "Accuracy %", "Status"];
                const tableRows = tasks.map((task, index) => {
                     const accuracy = task.completed ? calculateTaskAccuracy(task.expectedDuration, task.actualDuration) : 0;
                     return [
                         index + 1,
                         task.text.length > 30 ? task.text.substring(0, 30) + '...' : task.text,
                         new Date(task.date).toLocaleDateString(),
                         task.expectedDuration,
                         task.completed ? task.actualDuration : 'N/A',
                         task.completed ? `${accuracy}%` : 'N/A',
                         task.completed ? "✓ Completed" : "⏳ Pending",
                     ];
                });

                doc.autoTable({
                    head: [tableColumn],
                    body: tableRows,
                    startY: 60,
                    theme: 'grid',
                    styles: { fontSize: 8 },
                    headStyles: { fillColor: [99, 102, 241] },
                    columnStyles: {
                        0: { halign: 'center', cellWidth: 15 },
                        1: { cellWidth: 50 },
                        2: { halign: 'center', cellWidth: 30 },
                        3: { halign: 'center', cellWidth: 25 },
                        4: { halign: 'center', cellWidth: 25 },
                        5: { halign: 'center', cellWidth: 20 },
                        6: { halign: 'center', cellWidth: 25 }
                    }
                });
                
                // Current Day Summary
                const completedTasks = tasks.filter(t => t.completed).length;
                const totalTasks = tasks.length;
                const totalAssignedTime = tasks.reduce((sum, task) => sum + task.expectedDuration, 0);
                const totalActualTime = tasks.filter(t => t.completed).reduce((sum, task) => sum + task.actualDuration, 0);
                
                let finalY = doc.lastAutoTable.finalY || 60;
                doc.setFontSize(14);
                doc.text("Daily Summary", 14, finalY + 20);
                doc.setFontSize(10);
                doc.text(`Total Tasks: ${totalTasks}`, 14, finalY + 28);
                doc.text(`Completed Tasks: ${completedTasks}`, 14, finalY + 35);
                doc.text(`Completion Rate: ${totalTasks > 0 ? Math.round((completedTasks/totalTasks)*100) : 0}%`, 14, finalY + 42);
                doc.text(`Total Assigned Time: ${totalAssignedTime} minutes`, 14, finalY + 49);
                doc.text(`Total Actual Time: ${totalActualTime} minutes`, 14, finalY + 56);
                doc.text(`Overall Accuracy: ${overallAccuracy}%`, 14, finalY + 63);
                
                // Add new page for weekly overview
                doc.addPage();
                doc.setFontSize(16);
                doc.text("Weekly Performance Overview", 14, 22);
                
                // Get last 7 days data
                const today = new Date(selectedDate);
                const weeklyData = [];
                
                for (let i = 6; i >= 0; i--) {
                    const date = new Date(today);
                    date.setDate(today.getDate() - i);
                    const dateStr = getISOString(date);
                    
                    // This would need to be fetched from Firebase in a real implementation
                    // For now, we'll show the current day data
                    if (i === 0) {
                        weeklyData.push({
                            date: dateStr,
                            day: date.toLocaleDateString('en-US', { weekday: 'short' }),
                            tasks: tasks.length,
                            completed: completedTasks,
                            accuracy: overallAccuracy
                        });
                    } else {
                        weeklyData.push({
                            date: dateStr,
                            day: date.toLocaleDateString('en-US', { weekday: 'short' }),
                            tasks: 0,
                            completed: 0,
                            accuracy: 0
                        });
                    }
                }
                
                // Weekly table
                const weeklyColumns = ["Date", "Day", "Total Tasks", "Completed", "Accuracy %"];
                const weeklyRows = weeklyData.map(day => [
                    day.date,
                    day.day,
                    day.tasks,
                    day.completed,
                    `${day.accuracy}%`
                ]);
                
                doc.autoTable({
                    head: [weeklyColumns],
                    body: weeklyRows,
                    startY: 35,
                    theme: 'grid',
                    styles: { fontSize: 10 },
                    headStyles: { fillColor: [34, 197, 94] },
                    columnStyles: {
                        0: { cellWidth: 30 },
                        1: { cellWidth: 20 },
                        2: { halign: 'center', cellWidth: 25 },
                        3: { halign: 'center', cellWidth: 25 },
                        4: { halign: 'center', cellWidth: 25 }
                    }
                });
                
                // Performance Insights
                const weeklyFinalY = doc.lastAutoTable.finalY || 35;
                doc.setFontSize(14);
                doc.text("Performance Insights", 14, weeklyFinalY + 20);
                doc.setFontSize(10);
                
                const avgAccuracy = weeklyData.reduce((sum, day) => sum + day.accuracy, 0) / 7;
                const totalWeeklyTasks = weeklyData.reduce((sum, day) => sum + day.tasks, 0);
                const totalWeeklyCompleted = weeklyData.reduce((sum, day) => sum + day.completed, 0);
                
                doc.text(`Average Weekly Accuracy: ${Math.round(avgAccuracy)}%`, 14, weeklyFinalY + 28);
                doc.text(`Total Weekly Tasks: ${totalWeeklyTasks}`, 14, weeklyFinalY + 35);
                doc.text(`Total Weekly Completed: ${totalWeeklyCompleted}`, 14, weeklyFinalY + 42);
                doc.text(`Weekly Completion Rate: ${totalWeeklyTasks > 0 ? Math.round((totalWeeklyCompleted/totalWeeklyTasks)*100) : 0}%`, 14, weeklyFinalY + 49);
                
                // Footer
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.text(`Page ${i} of ${pageCount}`, 14, doc.internal.pageSize.height - 10);
                    doc.text(`Generated by TaskTrack - ${new Date().toLocaleDateString()}`, doc.internal.pageSize.width - 80, doc.internal.pageSize.height - 10);
                }

                doc.save(`TaskTrack-Report-${selectedDate}.pdf`);
                setNotification({ type: 'success', message: 'Comprehensive report downloaded!' });
            };

            const completedTasks = tasks.filter(t => t.completed).length;
            const totalTasks = tasks.length;
            const isToday = getISOString(new Date()) === selectedDate;
            
            return (
                <div className="min-h-screen bg-slate-100 dark:bg-slate-900">
                    <header className="bg-white dark:bg-slate-800 shadow-sm">
                        <div className="max-w-4xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <h1 className="text-xl sm:text-2xl font-bold text-indigo-600 dark:text-indigo-400">TaskTrack</h1>
                            <div className="flex items-center gap-4">
                                <button onClick={toggleTheme} className="text-slate-500 dark:text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-300">
                                    {theme === 'light' ? 
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg> : 
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                    }
                                </button>
                                <button onClick={onLogout} className="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-indigo-500 dark:hover:text-indigo-400 transition">Logout</button>
                            </div>
                        </div>
                    </header>
                    <main className="max-w-4xl mx-auto py-6 sm:py-8 px-4 sm:px-6 lg:px-8">
                        {/* NEW Streak banner from Version 2 */}
                        {streakData.current > 0 && 
                            <div className="mb-6 bg-amber-100 dark:bg-amber-900/50 border-l-4 border-amber-500 text-amber-700 dark:text-amber-300 p-4 rounded-lg flex items-center justify-center gap-4">
                                <span className="text-4xl">🔥</span>
                                <div>
                                    <p className="font-bold text-lg">{streakData.current} Day Streak!</p>
                                    <p className="text-sm">Keep up the great work! Your longest streak is {streakData.longest} days.</p>
                                </div>
                            </div>
                        }
                        
                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6 mb-8">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4">
                                <h2 className="text-lg sm:text-xl font-semibold text-slate-700 dark:text-slate-200 mb-2 sm:mb-0">Tasks for:</h2>
                                <input 
                                    type="date" 
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200"
                                />
                            </div>
                            {isToday && (
                                <form onSubmit={handleAddTask} className="space-y-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} placeholder="What do you need to do?" className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700" />
                                        <input type="text" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} placeholder="Category" className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700" />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <input type="number" value={newExpectedDuration} onChange={(e) => setNewExpectedDuration(e.target.value)} placeholder="Minutes" className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700" />
                                        {/* NEW Notes field from Version 2 */}
                                        <input type="text" value={newNotes} onChange={(e) => setNewNotes(e.target.value)} placeholder="Notes (optional)" className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-700" />
                                        <button type="submit" className="px-6 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">Add Task</button>
                                    </div>
                                </form>
                            )}
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 mb-8">
                           <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6 flex flex-col justify-center items-center">
                               <p className="text-3xl sm:text-4xl font-bold text-indigo-600 dark:text-indigo-400">{totalTasks}</p>
                               <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">Total Tasks</p>
                           </div>
                           <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6 flex flex-col justify-center items-center">
                               <p className="text-3xl sm:text-4xl font-bold text-green-500 dark:text-green-400">{completedTasks}</p>
                               <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mt-1">Completed</p>
                           </div>
                           <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6 flex flex-col justify-center items-center">
                               <div className="relative w-24 h-24">
                                   <svg className="w-full h-full" viewBox="0 0 36 36">
                                       <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#e6e6e6" className="dark:stroke-slate-700" strokeWidth="3" />
                                       <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke={overallAccuracy > 0 ? '#4ade80' : 'transparent'} strokeWidth="3" strokeDasharray={`${overallAccuracy}, 100`} strokeLinecap="round" />
                                   </svg>
                                   <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center">
                                       <p className="text-lg sm:text-xl font-bold text-slate-700 dark:text-slate-200">{overallAccuracy}%</p>
                                   </div>
                               </div>
                               <p className="text-sm font-medium text-slate-500 dark:text-slate-400 mt-2">Overall Accuracy</p>
                           </div>
                        </div>

                        <WeeklyAnalyticsChart tasksCollectionRef={tasksCollectionRef} theme={theme} />

                        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6">
                            {isLoading ? (
                                <p className="text-center text-slate-500 dark:text-slate-400">Loading tasks...</p>
                            ) : tasks.length > 0 ? (
                                <ul className="space-y-4">
                                    {tasks.map(task => {
                                        const taskAccuracy = task.completed ? calculateTaskAccuracy(task.expectedDuration, task.actualDuration) : null;
                                        return (
                                            <li key={task.id} className="flex items-start p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg transition-all duration-300 hover:shadow-md">
                                                <input 
                                                    type="checkbox" 
                                                    checked={task.completed}
                                                    onChange={() => task.completed ? handleUncompleteTask(task) : setTaskToComplete(task)}
                                                    className="h-5 w-5 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer flex-shrink-0 bg-white dark:bg-slate-600 mt-1"
                                                    disabled={!isToday}
                                                />
                                                <div className="flex-grow mx-3 sm:mx-4 overflow-hidden">
                                                    <p className={`text-slate-700 dark:text-slate-200 break-words ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}`}>{task.text}</p>
                                                    {task.notes && <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 italic">{task.notes}</p>}
                                                    <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-x-2 sm:gap-x-3 mt-1 flex-wrap">
                                                        {task.category && <span className="px-2 py-0.5 bg-indigo-100 text-indigo-800 dark:bg-indigo-900/50 dark:text-indigo-300 rounded-full font-medium">{task.category}</span>}
                                                        <span>Plan: {task.expectedDuration}m</span>
                                                        {task.completed && (
                                                            <React.Fragment>
                                                                <span className="hidden sm:inline">|</span>
                                                                <span>Actual: {task.actualDuration}m</span>
                                                                <span className="hidden sm:inline">|</span>
                                                                <span className={taskAccuracy >= 80 ? 'text-green-600 dark:text-green-400 font-semibold' : 'text-amber-600 dark:text-amber-400 font-semibold'}>
                                                                    Acc: {taskAccuracy}%
                                                                </span>
                                                            </React.Fragment>
                                                        )}
                                                    </div>
                                                </div>
                                                {isToday && (
                                                    <div className="flex items-center ml-auto flex-shrink-0 gap-2">
                                                        {/* NEW Pomodoro button from Version 2 */}
                                                        <button 
                                                            onClick={() => setTaskForPomodoro(task)} 
                                                            className="text-slate-400 hover:text-red-500 dark:hover:text-red-400 transition p-1" 
                                                            disabled={task.completed}
                                                            title="Start Pomodoro Timer"
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                            </svg>
                                                        </button>
                                                        <button onClick={() => setTaskToEdit(task)} className="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition p-1" disabled={task.completed}>
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L15.232 5.232z" /></svg>
                                                        </button>
                                                        <button onClick={() => deleteTask(task.id)} className="text-red-400 hover:text-red-600 transition p-1">
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                        </button>
                                                    </div>
                                                )}
                                            </li>
                                        );
                                    })}
                                </ul>
                            ) : (
                                <p className="text-center text-slate-500 dark:text-slate-400 py-8">No tasks found for this date.</p>
                            )}
                        </div>
                        
                        <div className="mt-8 text-center">
                            <button onClick={downloadReport} disabled={tasks.length === 0} className="px-8 py-3 bg-green-500 text-white font-semibold rounded-lg shadow-md hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition disabled:bg-green-300 dark:disabled:bg-green-800 disabled:cursor-not-allowed">
                                Download Daily Report
                            </button>
                        </div>
                    </main>
                    {taskToComplete && (
                        <CompletionModal
                            task={taskToComplete}
                            onComplete={handleCompleteTask}
                            onCancel={() => setTaskToComplete(null)}
                        />
                    )}
                     {taskToEdit && (
                        <EditTaskModal
                            task={taskToEdit}
                            onUpdate={handleUpdateTask}
                            onCancel={() => setTaskToEdit(null)}
                            setNotification={setNotification}
                        />
                    )}
                    {taskForPomodoro && (
                        <PomodoroTimerModal
                            task={taskForPomodoro}
                            onComplete={handlePomodoroComplete}
                            onCancel={() => setTaskForPomodoro(null)}
                            setNotification={setNotification}
                        />
                    )}
                </div>
            );
        };

        // --- Main App Component (Handles Routing and State) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [currentView, setCurrentView] = useState('home'); // 'home', 'auth', 'dashboard'
            const [firebaseReady, setFirebaseReady] = useState(false);

            // Theme state and handlers
            const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
            const toggleTheme = () => {
                const newTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(newTheme);
                localStorage.setItem('theme', newTheme);
            };

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [theme]);

            // Handle hash-based routing for Privacy and Contact pages
            useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash.substring(1);
                    if (hash === 'privacy' || hash === 'contact') {
                        setCurrentView(hash);
                    } else if (hash === '' && (currentView === 'privacy' || currentView === 'contact')) {
                        setCurrentView('home');
                    }
                };

                // Check initial hash on mount
                const initialHash = window.location.hash.substring(1);
                if (initialHash === 'privacy' || initialHash === 'contact') {
                    setCurrentView(initialHash);
                }

                // Listen for hash changes
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, [currentView]);

            // Initialize Firebase first
            useEffect(() => {
                const init = async () => {
                    try {
                        await initializeFirebase();
                        setFirebaseReady(true);
                    } catch (error) {
                        console.error('Firebase initialization failed:', error);
                        setNotification({ type: 'error', message: 'Failed to load application configuration. Please refresh the page or contact support.' });
                        setIsLoading(false);
                    }
                };
                init();
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                
                const unsubscribe = auth.onAuthStateChanged(user => {
                    setUser(user);
                    if(user) {
                        // Only go to dashboard if not on privacy/contact pages
                        if (currentView !== 'privacy' && currentView !== 'contact') {
                            setCurrentView('dashboard');
                        }
                    } else {
                        // If already on auth page, stay there, otherwise go home
                        if(currentView !== 'auth' && currentView !== 'privacy' && currentView !== 'contact') {
                            setCurrentView('home');
                        }
                    }
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [currentView, firebaseReady]); // Depend on currentView to avoid navigating away from auth page on logout

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                    // The onAuthStateChanged listener will handle setting the user to null
                    setNotification({ type: 'success', message: 'Logged out successfully!' });
                    setCurrentView('home');
                } catch (error) {
                    setNotification({ type: 'error', message: 'Failed to log out.' });
                }
            };

            const handleSetNotification = (notif) => {
                setNotification(notif);
            };

            if (isLoading) {
                return <Loader />;
            }

            return (
                <React.Fragment>
                    {notification && <Notification {...notification} onDismiss={() => setNotification(null)} />}
                    
                    {currentView === 'home' && <HomePage onLoginClick={() => setCurrentView('auth')} />}
                    
                    {currentView === 'auth' && <AuthPage setNotification={handleSetNotification} onBackToHome={() => { setCurrentView('home'); window.location.hash = ''; }} />}

                    {currentView === 'privacy' && <PrivacyPolicyPage onBackToHome={() => { setCurrentView('home'); window.location.hash = ''; }} />}

                    {currentView === 'contact' && <ContactPage onBackToHome={() => { setCurrentView('home'); window.location.hash = ''; }} />}

                    {currentView === 'dashboard' && user && (
                        <Dashboard 
                            user={user} 
                            setNotification={handleSetNotification} 
                            onLogout={handleLogout}
                            theme={theme}
                            toggleTheme={toggleTheme}
                        />
                    )}
                </React.Fragment>
            );
        };

        // --- Render the Application ---
        const container = document.getElementById('root');
        // Use the new ReactDOM.createRoot API for React 18
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
