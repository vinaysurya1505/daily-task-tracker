        const calculateDailyAccuracy = (tasks) => {
            const completed = tasks.filter(t => t.completed && t.expectedDuration > 0 && t.actualDuration > 0);
            if (completed.length === 0) return 0;
            const totalExpected = completed.reduce((sum, task) => sum + task.expectedDuration, 0);
            const totalActual = completed.reduce((sum, task) => sum + task.actualDuration, 0);
            if (totalExpected === 0) return 0;
            const accuracy = 100 - (Math.abs(totalExpected - totalActual) / totalExpected) * 100;
            return Math.max(0, Math.round(accuracy));
        };
        
        const getISOString = (date) => date.toISOString().split('T')[0];

        const showNotification = (title, body) => {
            if (!("Notification" in window)) {
                console.log("This browser does not support desktop notification");
                return;
            }

            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        new Notification(title, { body: body });
                    }
                });
            }
        };

        const playSound = () => {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A5 note
            gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 1);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1);
        };

        const PomodoroTimerModal = ({ task, onComplete, onCancel, setNotification }) => {
            const FOCUS_TIME = 25 * 60; const BREAK_TIME = 5 * 60;
            const [isBreak, setIsBreak] = useState(false);
            const [timeLeft, setTimeLeft] = useState(FOCUS_TIME);
            const [isActive, setIsActive] = useState(false);
            const timerRef = useRef(null);

            useEffect(() => {
                if (isActive && timeLeft > 0) {
                    timerRef.current = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    clearInterval(timerRef.current);
                    playSound();
                    if (!isBreak) {
                        const message = "Focus session complete! Time for a break.";
                        setNotification({ type: 'success', message: message });
                        showNotification("Pomodoro Timer", message);
                        onComplete(task, 25);
                        setIsBreak(true);
                        setTimeLeft(BREAK_TIME);
                        setIsActive(true); // Auto-start break
                    } else {
                        const message = "Break's over! Ready for another session?";
                        setNotification({ type: 'success', message: message });
                        showNotification("Pomodoro Timer", message);
                        onCancel();
                    }
                }
                return () => clearInterval(timerRef.current);
            }, [isActive, timeLeft]);

            const toggleTimer = () => {
                if (!isActive) {
                    if (Notification.permission === 'default') {
                        Notification.requestPermission();
                    }
                }
                setIsActive(!isActive)
            };
            const resetTimer = () => { clearInterval(timerRef.current); setIsActive(false); setIsBreak(false); setTimeLeft(FOCUS_TIME); };
            const formatTime = (seconds) => `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;

            return (

            useEffect(() => {
                const unsubscribe = metadataRef.onSnapshot(doc => {
                    if (doc.exists) {
                        setStreakData(doc.data());
                    }
                });
                return () => unsubscribe();
            }, [metadataRef]);

            useEffect(() => {
                setIsLoading(true);
                const q = tasksCollectionRef.where("date", "==", selectedDate);
                const unsubscribe = q.onSnapshot(querySnapshot => {
                    const tasksData = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    tasksData.sort((a, b) => {
                        const completedDiff = a.completed - b.completed;
                        if (completedDiff !== 0) return completedDiff;
                        const aTime = (a.createdAt && a.createdAt.seconds) || 0;
                        const bTime = (b.createdAt && b.createdAt.seconds) || 0;
                        return aTime - bTime;
                    });
                    setTasks(tasksData);
                    setIsLoading(false);
                }, error => {
                    console.error("Error fetching tasks: ", error);
                    setNotification({ type: 'error', message: "Couldn't load tasks."});
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [tasksCollectionRef, selectedDate]);
            
            const handleUpdateStreak = useCallback(async () => {
                const todayStr = getISOString(new Date());
                if (streakData.lastCompletedDate === todayStr) return; 

                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = getISOString(yesterday);

                let newCurrent = 1;
                if (streakData.lastCompletedDate === yesterdayStr) {
                    newCurrent = (streakData.current || 0) + 1;
                }
                
                const newLongest = Math.max(streakData.longest || 0, newCurrent);
                await metadataRef.set({ current: newCurrent, longest: newLongest, lastCompletedDate: todayStr }, { merge: true });

            }, [metadataRef, streakData]);
            
            const handleAddTask = async (e) => { e.preventDefault(); /* ... logic omitted for brevity ... */ };
            const handleUpdateTask = async (taskId, updatedData) => { /* ... logic omitted for brevity ... */ };
            const deleteTask = async (taskId) => { /* ... logic omitted for brevity ... */ };
            const handleUncompleteTask = async (task) => { /* ... logic omitted for brevity ... */ };
            
            const handleCompleteTask = async (task, actualDuration) => {
                await tasksCollectionRef.doc(task.id).update({ completed: true, actualDuration: parseInt(actualDuration, 10) });
                setTaskToComplete(null);
                setNotification({ type: 'success', message: 'Task complete!' });
                handleUpdateStreak();
            };

            const handlePomodoroComplete = (task, minutes) => {
                setTaskToComplete({ ...task, pomodoroMinutes: minutes });
                setTaskForPomodoro(null);
            };
            
            const overallAccuracy = useMemo(() => calculateDailyAccuracy(tasks), [tasks]);
            
            // ... Full JSX for TasksPage component ...
            return (
                <main className="max-w-4xl mx-auto py-6 sm:py-8 px-4 sm:px-6 lg:px-8">
                   {/* JSX content of TasksPage */}
                </main>
            );
        };
        
        const AnalyticsPage = ({ tasksCollectionRef, theme }) => {
            const [allTasks, setAllTasks] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const pieChartRef = useRef(null);
            const pieChartInstanceRef = useRef(null);

            useEffect(() => {
                const unsubscribe = tasksCollectionRef.onSnapshot(querySnapshot => {
                    const tasksData = querySnapshot.docs.map(doc => doc.data());
                    setAllTasks(tasksData);
                    setIsLoading(false);
                }, error => {
                    console.error("Error fetching all tasks:", error);
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [tasksCollectionRef]);
            
            const categoryData = useMemo(() => {
                const completed = allTasks.filter(t => t.completed && t.category && t.actualDuration > 0);
                const data = completed.reduce((acc, task) => {
                    const category = task.category || "Uncategorized";
                    acc[category] = (acc[category] || 0) + task.actualDuration;
                    return acc;
                }, {});
                return data;
            }, [allTasks]);

            useEffect(() => {
                if(pieChartRef.current && Object.keys(categoryData).length > 0) {
                    if(pieChartInstanceRef.current) pieChartInstanceRef.current.destroy();
                    const ctx = pieChartRef.current.getContext('2d');
                    const labelColor = theme === 'dark' ? '#cbd5e1' : '#475569';
                    const colors = ['#4f46e5', '#7c3aed', '#db2777', '#f59e0b', '#10b981', '#3b82f6'];
                    
                    pieChartInstanceRef.current = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: Object.keys(categoryData),
                            datasets: [{
                                label: 'Time Spent (minutes)',
                                data: Object.values(categoryData),
                                backgroundColor: colors,
                                borderColor: theme === 'dark' ? '#1e293b' : '#fff',
                                borderWidth: 2,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: labelColor }
                                }
                            }
                        }
                    });
                }
                 return () => { if(pieChartInstanceRef.current) pieChartInstanceRef.current.destroy(); }
            }, [categoryData, theme]);

            return (
                <main className="max-w-4xl mx-auto py-6 sm:py-8 px-4 sm:px-6 lg:px-8 space-y-8">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-lg p-4 sm:p-6">
                        <h3 className="text-lg sm:text-xl font-semibold text-slate-700 dark:text-slate-200 mb-4">Time Distribution by Category</h3>
                        <div className="relative h-80">
                            {isLoading ? <p>Loading...</p> : Object.keys(categoryData).length > 0 ? <canvas ref={pieChartRef}></canvas> : <p className="text-center text-slate-500 dark:text-slate-400 pt-16">Complete tasks with categories to see your time distribution.</p>}
                        </div>
                    </div>
                </main>
            );
        };
        
        const Dashboard = ({ user, setNotification, onLogout, theme, toggleTheme }) => {
            const [activePage, setActivePage] = useState('tasks');
            const tasksCollectionRef = useMemo(() => db.collection(`artifacts/${appId}/users/${user.uid}/tasks`), [user.uid]);
            const [remindersEnabled, setRemindersEnabled] = useState(localStorage.getItem('remindersEnabled') === 'true');
            const reminderIntervalRef = useRef(null);

            const handleToggleReminders = () => {
                const newStatus = !remindersEnabled;
                setRemindersEnabled(newStatus);
                localStorage.setItem('remindersEnabled', newStatus);
                setNotification({ type: 'success', message: `15-minute reminders are now ${newStatus ? 'ON' : 'OFF'}.` });
                if (newStatus && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            };
            
            useEffect(() => {
                if (remindersEnabled) {
                    reminderIntervalRef.current = setInterval(() => {
                        showNotification("Stay on Track!", "Just a friendly 15-minute reminder to stay focused.");
                    }, 15 * 60 * 1000);
                }
                return () => {
                    if (reminderIntervalRef.current) {
                        clearInterval(reminderIntervalRef.current);
                    }
                };
            }, [remindersEnabled]);

            return (
                <div className="min-h-screen bg-slate-100 dark:bg-slate-900">
                    <header className="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto py-4 px-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <h1 className="text-xl sm:text-2xl font-bold text-indigo-600 dark:text-indigo-400">TaskTrack</h1>
                            <div className="hidden sm:flex items-center gap-2 border border-slate-200 dark:border-slate-700 rounded-lg p-1">
                                <button onClick={() => setActivePage('tasks')} className={`px-3 py-1 text-sm font-semibold rounded-md ${activePage === 'tasks' ? 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>Tasks</button>
                                <button onClick={() => setActivePage('analytics')} className={`px-3 py-1 text-sm font-semibold rounded-md ${activePage === 'analytics' ? 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>Analytics</button>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={handleToggleReminders} title="Toggle 15-minute reminders" className={remindersEnabled ? 'text-green-500' : 'text-slate-500 dark:text-slate-400'}>
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                                    </svg>
                                </button>
                                <button onClick={toggleTheme} className="text-slate-500 dark:text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-300">
                                    {theme === 'light' ? 
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg> : 
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                                    }
                                </button>
                                <button onClick={onLogout} className="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-indigo-500 dark:hover:text-indigo-400 transition">Logout</button>
                            </div>
                        </div>
                    </header>
                    {activePage === 'tasks' && <TasksPage tasksCollectionRef={tasksCollectionRef} user={user} setNotification={setNotification} theme={theme} />}
                    {activePage === 'analytics' && <AnalyticsPage tasksCollectionRef={tasksCollectionRef} theme={theme} />}
                </div>
            );
        };
        
        const App = () => {
             const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [currentPage, setCurrentPage] = useState('home'); 
            const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [theme]);
            
            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(currentUser => {
                    setUser(currentUser);
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogout = () => { auth.signOut(); setCurrentPage('home'); };
            const handleDismissNotification = () => setNotification(null);
            
            const renderContent = () => {
                if (user) {
                    return <Dashboard user={user} setNotification={setNotification} onLogout={handleLogout} theme={theme} toggleTheme={toggleTheme} />;
                }
                if (currentPage === 'home') return <HomePage onLoginClick={() => setCurrentPage('auth')} />;
                if (currentPage === 'auth') return <AuthPage setNotification={setNotification} onBackToHome={() => setCurrentPage('home')} />;
            };

            if (isLoading) return <Loader />;

            return (
                <React.Fragment>
                    {notification && <Notification message={notification.message} type={notification.type} onDismiss={handleDismissNotification} />}
                    {renderContent()}
                </React.Fragment>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
